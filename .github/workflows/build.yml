name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q BrainBoostGame.zip
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: cd BrainBoost && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BrainBoost-debug-apk
          path: BrainBoost/app/build/outputs/apk/debug/*.apk
